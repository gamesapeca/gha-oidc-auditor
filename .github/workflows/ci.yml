name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3ac63c768f2 # v5.2.0
        with:
          go-version: '1.22'

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run test suite
        run: go test -v -race ./...

      - name: Build binary
        run: go build -v -o gha-oidc ./cmd/gha-oidc

      - name: Dogfood security audit
        run: ./gha-oidc scan --path .github/workflows --format console --fail-on high
